name: freestiler-core

# Fast Rust-only feedback against the workspace lockfile.
# Does not replace the Windows R package job.
on:
  pull_request:
    paths:
      - ".github/workflows/freestiler-core.yml"
      - "src/rust/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/freestiler-core.yml"
      - "src/rust/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  check:
    name: cargo (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: ""
            label: default
          - features: "--features geoparquet,duckdb"
            label: geoparquet+duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-core-${{ matrix.label }}-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-${{ matrix.label }}-

      - name: cargo check -p freestiler-core
        working-directory: src/rust
        run: cargo check --locked -p freestiler-core ${{ matrix.features }}

      - name: cargo test -p freestiler-core --lib
        working-directory: src/rust
        run: cargo test --locked -p freestiler-core --lib ${{ matrix.features }}
