name: R Package

on:
  pull_request:
    paths:
      - ".github/workflows/r-package.yml"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "man/**"
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "inst/**"
      - "configure"
      - "configure.win"
      - "cleanup"
      - "justfile"
  push:
    branches:
      - main
    tags:
      - "r-v*"
    paths:
      - ".github/workflows/r-package.yml"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "man/**"
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "inst/**"
      - "configure"
      - "configure.win"
      - "cleanup"
      - "justfile"
  workflow_dispatch:

permissions:
  contents: read

env:
  NOT_CRAN: "true"
  CARGO_TERM_COLOR: always

jobs:
  # Single Windows runner, one DuckDB/GeoParquet compile per event:
  #   PR → R CMD check
  #   main / dispatch → INSTALL --build + smoke + tests
  #   success on main → refresh `continuous` prerelease
  #   tags r-v* → versioned GitHub Release
  windows:
    name: Windows
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/freestiler-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::pkgbuild, any::testthat
          needs: check

      - name: Use online Cargo resolution in CI
        shell: bash
        run: |
          rm -f src/rust/vendor.tar.xz
          rm -rf src/vendor src/.cargo

      - name: R CMD check
        if: github.event_name == 'pull_request'
        uses: r-lib/actions/check-r-package@v2
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
        with:
          args: 'c("--no-manual", "--no-multiarch")'
          error-on: '"error"'
          upload-snapshots: true

      - name: Build Windows binary
        if: github.event_name != 'pull_request'
        id: binary
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
        run: |
          mkdir -p binary
          R CMD INSTALL --build .
          mv *.zip binary/
          echo "zip=$(ls binary/*.zip | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Verify both Rust backends are compiled in
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          Rscript tools/feature-smoke.R --require-rust-duckdb --require-geoparquet

      - name: Unit tests (installed package)
        if: github.event_name != 'pull_request'
        shell: Rscript {0}
        run: |
          testthat::test_local(load_package = "installed")

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: r-binary-windows
          path: binary/*.zip

      - name: Publish continuous prerelease
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous Windows binary
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: binary/*.zip
          body: |
            Auto-updated Windows binary from `main` (`${{ github.sha }}`).

            Always-on Rust DuckDB + GeoParquet. Install with:

            ```r
            # download the .zip from this release, then:
            install.packages("path/to/freestiler_*.zip", repos = NULL)
            ```

            Formal versioned releases use tags `r-v*` (for example `r-v0.3.0`).
            Releases page: https://github.com/jimbrig/freestiler/releases

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/r-v')
        uses: softprops/action-gh-release@v2
        with:
          files: binary/*.zip
          generate_release_notes: true
          make_latest: true

      - name: Release summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "## Windows binary"
            echo
            if [[ "${{ github.ref }}" == refs/tags/r-v* ]]; then
              echo "Published versioned release for \`${{ github.ref_name }}\`."
            elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
              echo "Updated prerelease tag \`continuous\`."
            else
              echo "Binary built; not published (ref \`${{ github.ref }}\`)."
            fi
            echo
            echo "- Artifact: \`r-binary-windows\`"
            echo "- Releases: https://github.com/jimbrig/freestiler/releases"
            echo "- Continuous: https://github.com/jimbrig/freestiler/releases/tag/continuous"
          } >> "$GITHUB_STEP_SUMMARY"
