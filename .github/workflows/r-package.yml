name: R Package

on:
  pull_request:
    paths:
      - ".github/workflows/r-package.yml"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "man/**"
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "inst/**"
      - "configure"
      - "configure.win"
      - "cleanup"
      - "justfile"
  push:
    branches:
      - main
    tags:
      - "r-v*"
    paths:
      - ".github/workflows/r-package.yml"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "man/**"
      - "src/**"
      - "tools/**"
      - "tests/**"
      - "inst/**"
      - "configure"
      - "configure.win"
      - "cleanup"
      - "justfile"
  workflow_dispatch:

permissions:
  contents: read

env:
  NOT_CRAN: "true"
  CARGO_TERM_COLOR: always

jobs:
  # Single Windows runner, one DuckDB/GeoParquet compile per event:
  #   PR / dispatch → R CMD check
  #   push main / tags → INSTALL --build + feature-smoke (+ release on r-v*)
  windows:
    name: Windows
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/freestiler-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::pkgbuild, any::testthat
          needs: check

      - name: Use online Cargo resolution in CI
        shell: bash
        run: |
          rm -f src/rust/vendor.tar.xz
          rm -rf src/vendor src/.cargo

      - name: R CMD check
        if: github.event_name == 'pull_request'
        uses: r-lib/actions/check-r-package@v2
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
        with:
          args: 'c("--no-manual", "--no-multiarch")'
          error-on: '"error"'
          upload-snapshots: true

      - name: Build Windows binary
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
        run: |
          mkdir -p binary
          R CMD INSTALL --build .
          mv *.zip binary/

      - name: Verify both Rust backends are compiled in
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          Rscript tools/feature-smoke.R --require-rust-duckdb --require-geoparquet

      - name: Unit tests (installed package)
        if: github.event_name != 'pull_request'
        shell: Rscript {0}
        run: |
          testthat::test_local(load_package = "installed")

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/r-v')
        with:
          name: r-binary-windows
          path: binary/*.zip

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/r-v')
        uses: softprops/action-gh-release@v2
        with:
          files: binary/*.zip
          generate_release_notes: true
