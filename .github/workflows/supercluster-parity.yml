name: Supercluster parity

on:
  pull_request:
    paths:
      - ".github/workflows/supercluster-parity.yml"
      - "tools/supercluster-compat/**"
      - "src/rust/freestiler-core/src/supercluster/**"
      - "src/rust/freestiler-core/tests/fixtures/supercluster-*"
      - "src/rust/freestiler-core/Cargo.toml"
      - "inst/COPYRIGHTS"
      - "tools/check_upstream_licenses.py"
      - "DESCRIPTION"
      - "LICENSE.note"
      - ".Rbuildignore"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supercluster-parity.yml"
      - "tools/supercluster-compat/**"
      - "src/rust/freestiler-core/src/supercluster/**"
      - "src/rust/freestiler-core/tests/fixtures/supercluster-*"
      - "src/rust/freestiler-core/Cargo.toml"
      - "inst/COPYRIGHTS"
      - "tools/check_upstream_licenses.py"
      - "DESCRIPTION"
      - "LICENSE.note"
      - ".Rbuildignore"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    name: Kernel (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-14]
        toolchain: ["1.77.2", stable]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check distribution attribution copies
        run: python tools/check_upstream_licenses.py

      - name: Install pinned toolchain without changing default
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/supercluster-compat/target
          key: ${{ runner.os }}-sc-${{ matrix.toolchain }}-${{ hashFiles('tools/supercluster-compat/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sc-${{ matrix.toolchain }}-

      - name: Run the actual kernel source and strict upstream fixtures
        run: cargo +${{ matrix.toolchain }} test --manifest-path tools/supercluster-compat/Cargo.toml --locked

      - name: Verify optimized arithmetic against the same fixtures
        run: cargo +${{ matrix.toolchain }} test --manifest-path tools/supercluster-compat/Cargo.toml --locked --release
